# ==============================================================================
# RetailPulse — Docker Compose Production Stack
# Single-command deployment with resource caps and automatic recovery
# ==============================================================================


services:
  retailpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: retailpulse:latest
    container_name: retailpulse_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - OMP_NUM_THREADS=2
      - MALLOC_TRIM_THRESHOLD_=65536
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
